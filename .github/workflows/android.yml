# Arma el instalador de Android (APK) cada vez que cambia la app
# y lo publica en Releases para descargarlo.
name: App Android

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar archivos de la app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1d4e89' --iconBackgroundColorDark '#1d4e89' --splashBackgroundColor '#1d4e89' --splashBackgroundColorDark '#1d4e89'
          npx cap sync android

      - name: Compilar APK
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Presupuestos-Electricos.apk

      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Presupuestos-Electricos.apk \
            --target "${{ github.sha }}" \
            --title "App para Android" \
            --notes "Descarga Presupuestos-Electricos.apk en tu teléfono Android y ábrelo para instalarlo. Si el teléfono lo pide, permite instalar apps de esta fuente."
